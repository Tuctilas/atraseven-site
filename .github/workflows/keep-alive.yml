# Mantém a API do Render acordada.
#
# O plano free do Render hiberna o serviço após ~15 min sem tráfego, e o
# próximo acesso espera ~30-50s ele religar — é o que fazia as fotos do site
# "demorarem a aparecer". Este job cutuca a API a cada 10 min para ela não
# dormir. Não usa segredo nenhum: só faz um GET numa rota pública.
#
# Observação: o agendador do GitHub Actions pode atrasar alguns minutos em
# horário de pico; por isso o intervalo (10 min) fica com folga sob os 15 min
# de inatividade que derrubam o Render.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

# Evita acumular execuções se uma demorar (a API religando pode levar ~1 min).
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Cutuca a API para não hibernar
        run: |
          URL="https://atra-seven-api.onrender.com/api/content"
          # -s silencioso; medimos o código e o tempo. Sem -f: até um 4xx serve
          # para acordar o serviço, então não queremos que o passo falhe por isso.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL")
          echo "GET $URL -> HTTP $code"
          # Só falha se nem conseguiu conectar (código 000).
          if [ "$code" = "000" ]; then
            echo "Não foi possível conectar à API." >&2
            exit 1
          fi
