# Configuração do Cloudflare Pages, versionada no repositório.
#
# pages_build_output_dir define o diretório publicado AQUI no repo, então
# não depende do campo manual no painel (que vinha ficando na raiz e expondo
# o backend). Isso também evita ter que editar o painel — o que estava
# derrubando a conexão com o GitHub a cada alteração.

name = "atraseven-site"
pages_build_output_dir = "./public"
compatibility_date = "2026-07-30"
