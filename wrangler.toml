# Configuração do Cloudflare Pages, versionada no repositório.
#
# O site é estático; pages_build_output_dir fixa o diretório publicado em
# dist-site, então não depende do campo manual no painel. O comando de
# build (npm run build) monta essa pasta.
#
# (Usamos Pages em vez de Workers porque o Pages aceita o domínio
# www.atraseven.com.br via CNAME mantendo o DNS na HostGator — assim o
# e-mail da empresa não é afetado.)

name = "atraseven-site"
pages_build_output_dir = "./dist-site"
compatibility_date = "2026-07-30"
