# Configuração do Cloudflare (Workers Static Assets), versionada no repo.
#
# O site é 100% estático, então é publicado como um Worker que serve apenas
# os arquivos da pasta dist-site — sem código de Worker (sem "main"):
#   • URL que casa com um arquivo em dist-site  -> serve o arquivo
#   • URL que não casa                          -> 404
#
# O comando de build (npm run build) monta dist-site; o deploy é
# `npx wrangler deploy`, que lê esta configuração.

name = "atraseven-site"
compatibility_date = "2026-07-30"

[assets]
directory = "./dist-site"
